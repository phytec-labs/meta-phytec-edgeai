# Layer configuration for meta-phytec-evolv

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "phytec-evolv"
BBFILE_PATTERN_phytec-evolv = "^${LAYERDIR}/"

# meta-phytec is 20; sit above it so anything we add wins outright.
BBFILE_PRIORITY_phytec-evolv = "25"

LAYERDEPENDS_phytec-evolv = "core phytec ampliphy ros2-jazzy-layer"
LAYERSERIES_COMPAT_phytec-evolv = "scarthgap"

# meta-ros scarthgap appends python3-pyqt-builder-native_1.19.1, but the
# meta-qt6 shipped with this BSP provides 1.18.0, leaving a dangling append
# that fails the parse. The image is headless and pulls no PyQt6.
BBMASK += "meta-ros/meta-ros2/dynamic-layers/meta-qt6/recipes-python/pyqt6/python3-pyqt-builder-native_1.19.1.bbappend"

# ROS 2 tracetools pulls in lttng-tools, which recommends lttng-modules. The
# poky lttng-modules 2.13.12 does not build against the 6.12.35 kernel
# (uprobe_register API change). Opt out of kernel tracing the same way poky
# does for arc/riscv64; userspace tracing via lttng-ust is unaffected.
LTTNGMODULES:am62axx = ""
